<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Slot Randomizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Digital Font & Effects */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        .digital-font {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
        }

        /* The glass effect for the reel container */
        .reel-glass {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 50%, rgba(15, 23, 42, 0.9) 100%);
            box-shadow:
                inset 0 10px 20px -10px rgba(0, 0, 0, 0.8),
                inset 0 -10px 20px -10px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* The glowing text effect */
        .neon-text {
            color: #38bdf8;
            /* Sky 400 */
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Motion blur when spinning */
        .spinning .digit-display {
            filter: blur(1.5px);
            opacity: 0.8;
            transform: scaleY(1.05);
            /* Slight stretch for speed illusion */
        }

        /* Smooth transition for the digit display */
        .digit-display {
            transition: filter 0.1s ease, opacity 0.1s ease, transform 0.1s ease;
        }

        /* Button glow */
        .btn-glow {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-glow:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body
    class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4 selection:bg-sky-500 selection:text-white">

    <!-- Main Container -->
    <div
        class="max-w-3xl w-full bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-800 p-6 md:p-10 flex flex-col items-center relative overflow-hidden">

        <!-- Decorative Background Lights -->
        <div class="absolute top-0 left-1/4 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl -z-10"></div>
        <div class="absolute bottom-0 right-1/4 w-64 h-64 bg-red-500/10 rounded-full blur-3xl -z-10"></div>

        <!-- Header -->
        <h1
            class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 mb-2 text-center uppercase tracking-widest drop-shadow-[0_0_15px_rgba(56,189,248,0.3)]">
            Random Number Slot Generator
        </h1>
        <p class="text-slate-400 mb-8 text-sm md:text-base text-center max-w-md">
            Set your upper limit. Hit spin to generate a random outcome within your range.
        </p>

        <!-- Slot Machine Display -->
        <div class="flex gap-2 md:gap-4 mb-10 w-full justify-center">
            <!-- Reel 1 -->
            <div
                class="reel-glass reel-container w-16 h-24 md:w-24 md:h-32 rounded-xl flex items-center justify-center relative overflow-hidden">
                <div id="reel1" class="digit-display digital-font text-4xl md:text-6xl neon-text">0</div>
                <!-- Glass reflection -->
                <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent h-1/2 pointer-events-none">
                </div>
            </div>
            <!-- Reel 2 -->
            <div
                class="reel-glass reel-container w-16 h-24 md:w-24 md:h-32 rounded-xl flex items-center justify-center relative overflow-hidden">
                <div id="reel2" class="digit-display digital-font text-4xl md:text-6xl neon-text">0</div>
                <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent h-1/2 pointer-events-none">
                </div>
            </div>
            <!-- Reel 3 -->
            <div
                class="reel-glass reel-container w-16 h-24 md:w-24 md:h-32 rounded-xl flex items-center justify-center relative overflow-hidden">
                <div id="reel3" class="digit-display digital-font text-4xl md:text-6xl neon-text">0</div>
                <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent h-1/2 pointer-events-none">
                </div>
            </div>
            <!-- Reel 4 -->
            <div
                class="reel-glass reel-container w-16 h-24 md:w-24 md:h-32 rounded-xl flex items-center justify-center relative overflow-hidden">
                <div id="reel4" class="digit-display digital-font text-4xl md:text-6xl neon-text">0</div>
                <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent h-1/2 pointer-events-none">
                </div>
            </div>
        </div>

        <!-- Controls Section -->
        <div
            class="w-full flex flex-col md:flex-row gap-6 items-end justify-between bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50">

            <!-- Setting Number Input -->
            <div class="flex flex-col w-full md:w-1/2">
                <label for="targetNumber" class="text-xs text-sky-400 font-bold mb-2 uppercase tracking-wider">Set Upper
                    Limit</label>
                <div class="relative">
                    <input type="text" id="targetNumber" maxlength="4" value="0030"
                        class="w-full bg-slate-900/80 border border-slate-600 text-sky-300 text-center digital-font text-3xl rounded-xl p-3 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all placeholder-slate-600 shadow-inner"
                        placeholder="0030">
                </div>
                <span class="text-xs text-slate-400 mt-2">Output will be between 0001 and your input.</span>
            </div>

            <!-- Spin Button -->
            <div class="w-full md:w-1/2 flex justify-center md:justify-end">
                <button id="spinBtn"
                    class="w-full md:w-auto bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 text-white font-black text-xl py-4 px-12 rounded-xl btn-glow transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed uppercase tracking-widest">
                    SPIN
                </button>
            </div>
        </div>

        <!-- Result Message -->
        <div id="resultMessage"
            class="mt-8 text-2xl font-bold text-emerald-400 opacity-0 transition-all duration-500 transform translate-y-4">
            Result: <span id="finalResultText" class="digital-font text-3xl">----</span>
        </div>

    </div>

    <script>
        // --- Configuration ---
        const SPIN_DURATION = 5000; // 5 seconds in milliseconds
        const REEL_IDS = ['reel1', 'reel2', 'reel3', 'reel4'];

        // --- State ---
        let isSpinning = false;

        // --- DOM Elements ---
        const spinBtn = document.getElementById('spinBtn');
        const targetInput = document.getElementById('targetNumber');
        const resultMessage = document.getElementById('resultMessage');
        const finalResultText = document.getElementById('finalResultText');
        const reelElements = REEL_IDS.map(id => document.getElementById(id));

        // --- Initialization ---
        function init() {
            // Input validation (only allow numbers, max 4 chars)
            targetInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
            });

            // Spin button listener
            spinBtn.addEventListener('click', startSpin);
        }

        // --- Animation Logic ---

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.textContent = 'SPINNING...';
            resultMessage.style.opacity = '0';
            resultMessage.style.transform = 'translateY(10px)';

            // 1. Get the user's input and parse it as an integer
            const maxInput = parseInt(targetInput.value, 10) || 0;
            let randomNumber = 0;

            // 2. Generate a random number based on the user's limit
            if (maxInput > 0) {
                // Generates a random integer between 1 and maxInput (inclusive)
                randomNumber = Math.floor(Math.random() * maxInput) + 1;
            } else {
                randomNumber = 0;
            }

            // 3. Pad the result with leading zeros to make it 4 digits
            const randomResult = randomNumber.toString().padStart(4, '0');
            finalResultText.textContent = randomResult;

            // 4. Start the decelerating flash animation for each reel
            for (let i = 0; i < 4; i++) {
                spinReel(reelElements[i], randomResult[i]);
            }

            // 5. After 5 seconds, stop everything and show the result
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = 'SPIN AGAIN';
                resultMessage.style.opacity = '1';
                resultMessage.style.transform = 'translateY(0)';
            }, SPIN_DURATION);
        }

        /**
         * Handles the rapid number flashing for a single reel.
         * @param {HTMLElement} element - The DOM element for the digit
         * @param {string} targetDigit - The final digit to land on (e.g., '3')
         */
        function spinReel(element, targetDigit) {
            const startTime = performance.now();
            const reelContainer = element.parentElement;

            // Add spinning class for motion blur
            reelContainer.classList.add('spinning');

            function update() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / SPIN_DURATION, 1);

                if (progress < 1) {
                    // Show a random digit from 0-9
                    element.textContent = Math.floor(Math.random() * 10);

                    // Calculate the next tick speed.
                    // Starts very fast (30ms) and slows down dramatically towards the end (up to 400ms)
                    // Using an exponential curve to make the slowdown feel natural
                    const currentSpeed = 30 + (370 * Math.pow(progress, 4));

                    setTimeout(update, currentSpeed);
                } else {
                    // Animation complete for this reel
                    reelContainer.classList.remove('spinning');
                    element.textContent = targetDigit;
                }
            }

            // Start the loop
            update();
        }

        // --- Run ---
        init();

    </script>
</body>

</html>
